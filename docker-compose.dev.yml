services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php
    restart: unless-stopped
    env_file:
      - .env
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VITE_HOST: vite
      VITE_PORT: 5173
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
      - storage_data:/var/www/html/storage
    develop:
      watch:
        # Source is already bind-mounted, so only watch for image-level changes.
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
        - action: rebuild
          path: ./Dockerfile
    depends_on:
      redis:
        condition: service_started
      # Wait so vendor volume is fully populated before php artisan serve boots.
      composer:
        condition: service_completed_successfully
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal

  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -lc "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    develop:
      watch:
        # Sync frontend source and rebuild vite service when package manifest changes.
        - action: sync
          path: ./resources
          target: /var/www/html/resources
        - action: sync
          path: ./vite.config.js
          target: /var/www/html/vite.config.js
        - action: sync
          path: ./tailwind.config.js
          target: /var/www/html/tailwind.config.js
        - action: sync
          path: ./postcss.config.js
          target: /var/www/html/postcss.config.js
        - action: rebuild
          path: ./package.json
        - action: restart
          path: ./package-lock.json
    depends_on:
      - app
    networks:
      - internal

  composer:
    build:
      context: .
      dockerfile: Dockerfile
      target: php
    working_dir: /var/www/html
    entrypoint: ["composer"]
    command: ["install", "--no-interaction", "--prefer-dist", "--optimize-autoloader"]
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - internal

  horizon:
    profiles:
      - horizon
    build:
      context: .
      dockerfile: Dockerfile
      target: php
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    entrypoint: ["/usr/local/bin/docker-entrypoint-app.sh"]
    command: ["php", "artisan", "horizon"]
    networks:
      - internal

networks:
  internal:

volumes:
  redis_data:
  storage_data:
  vendor_data:
  node_modules_data:
