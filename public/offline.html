<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انقطع الاتصال | VidaNexus AI</title>
    <link rel="icon" type="image/png" href="/favicon-192x192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --primary-cyan: #06b6d4;
            --primary-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
        }
        .offline-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-wrapper {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-cyan);
            font-size: 36px;
            position: relative;
        }
        .icon-wrapper::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--primary-cyan);
            opacity: 0.3;
            animation: pulseRing 2s infinite;
        }
        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        h1 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 12px;
            color: #fff;
        }
        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 28px;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--primary-cyan), #0284c7);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.35);
            width: 100%;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(6, 182, 212, 0.5);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-bottom: 20px;
        }
        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="status-badge">
            <span class="dot"></span>
            <span>أنت غير متصل بالإنترنت</span>
        </div>
        <div class="icon-wrapper">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1>انقطع اتصال الإنترنت</h1>
        <p>يبدو أنك فقدت الاتصال بشبكة الإنترنت حالياً. سيقوم التطبيق بإعادة الاتصال تلقائياً بمجرد عودة الشبكة.</p>
        <button class="btn-retry" onclick="checkConnection()">
            <i class="fas fa-rotate-right"></i>
            <span>إعادة المحاولة الآن</span>
        </button>
    </div>

    <script>
        function checkConnection() {
            const btn = document.querySelector('.btn-retry');
            const icon = btn.querySelector('i');
            icon.classList.add('fa-spin');
            
            fetch('/favicon-32x32.png?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
                .then(function() {
                    window.location.reload();
                })
                .catch(function() {
                    setTimeout(function() {
                        icon.classList.remove('fa-spin');
                    }, 800);
                });
        }

        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
