# CI pipeline for Laravel + Vite.
#
# Environment and secrets (GitHub → Settings → Secrets and variables → Actions):
# - Use "Repository secrets" for sensitive values (API keys, APP_KEY for reproducible builds, etc.).
# - Use "Variables" for non-sensitive defaults (APP_URL for a staging deploy job, feature flags).
#
# Injecting secrets into the app at runtime (recommended patterns):
# 1) CI tests: copy .env.example, run `php artisan key:generate`, then append only what tests need:
#    echo "SOME_API_KEY=${{ secrets.SOME_API_KEY }}" >> .env
# 2) Docker / production: pass env at orchestration time (Compose `environment:`, K8s secrets, host env).
#    Do not bake secrets into the image; mount or inject `.env` in the runtime environment.
# 3) Pull requests from forks: `secrets.*` are not available to untrusted workflows; keep tests hermetic.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, fileinfo, sqlite, pdo_sqlite, bcmath, intl, zip, pcntl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Application environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Optional — APP_KEY from repository secret
        if: ${{ secrets.APP_KEY != '' }}
        run: sed -i "s|^APP_KEY=.*|APP_KEY=${{ secrets.APP_KEY }}|" .env

      - name: Optional — append extra env lines (secret or variable)
        if: ${{ secrets.CI_DOTENV_APPEND != '' }}
        run: printf '%s\n' "${{ secrets.CI_DOTENV_APPEND }}" >> .env

      - name: Build Vite assets
        run: npm run build

      - name: Run PHPUnit
        run: php artisan test
